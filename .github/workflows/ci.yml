name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest && pytest -q

  benchmark:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/checkout@v4
        with: {repository: yurtseveronder-design/ai-sentinel, path: .sut/ai-sentinel}
      - uses: actions/checkout@v4
        with: {repository: yurtseveronder-design/sentinel-semantic, path: .sut/sentinel-semantic}
      - uses: actions/checkout@v4
        with: {repository: yurtseveronder-design/sentinel-ui, path: .sut/sentinel-ui}
      - name: Install the stack
        run: |
          pip install -e .sut/ai-sentinel -e .sut/sentinel-semantic
          pip install fastapi uvicorn pydantic
          pip install -e .
      - run: scripts/stack.sh start
      - name: Benchmark ai-sentinel (with semantic layer)
        run: sentinel-eval --target scan --out reports --baseline baseline.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Benchmark whole stack via sentinel-ui
        run: sentinel-eval --target gateway --out reports | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            .stack/*.log

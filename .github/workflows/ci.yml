name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest && pytest -q

  benchmark:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: keyword, engine: keyword, threshold: "0.60", model: "all-MiniLM-L6-v2"}
          - {name: embedding-0.50, engine: embedding, threshold: "0.50", model: "paraphrase-multilingual-MiniLM-L12-v2"}
          - {name: embedding-0.60, engine: embedding, threshold: "0.60", model: "paraphrase-multilingual-MiniLM-L12-v2"}
          - {name: embedding-0.70, engine: embedding, threshold: "0.70", model: "paraphrase-multilingual-MiniLM-L12-v2"}
    name: benchmark (${{ matrix.name }})
    defaults:
      run:
        shell: bash  # bash -eo pipefail, so a failing eval is not hidden by `| tee`
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/checkout@v4
        with: {repository: yurtseveronder-design/ai-sentinel, path: .sut/ai-sentinel}
      - uses: actions/checkout@v4
        with: {repository: yurtseveronder-design/sentinel-semantic, path: .sut/sentinel-semantic}
      - uses: actions/checkout@v4
        with: {repository: yurtseveronder-design/sentinel-ui, path: .sut/sentinel-ui}
      - name: Install the stack
        run: |
          pip install -e .sut/ai-sentinel
          if [ "${{ matrix.engine }}" = embedding ]; then
            pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
            pip install -e ".sut/sentinel-semantic[embeddings]"
          else
            pip install -e .sut/sentinel-semantic
          fi
          pip install fastapi uvicorn pydantic
          pip install -e .
      - name: Start the stack
        run: scripts/stack.sh start
        env:
          SENTINEL_RATE_LIMIT_MAX: "100000"
          SEMANTIC_ENGINE: ${{ matrix.engine }}
          SEMANTIC_MODEL_NAME: ${{ matrix.model }}
          SEMANTIC_JAILBREAK_THRESHOLD: ${{ matrix.threshold }}
      - name: Dev set (gated against baseline.json, keyword engine only)
        run: |
          args="--out reports/dev"
          [ "${{ matrix.engine }}" = keyword ] && args="$args --baseline baseline.json"
          sentinel-eval --target scan --dataset data/prompts.jsonl $args | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Held-out set (report only; the rules were tuned against it)
        run: sentinel-eval --target scan --dataset data/heldout.jsonl --out reports/heldout --max-errors 0 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Blind set (report only; never tuned against)
        run: sentinel-eval --target scan --dataset data/blind.jsonl --out reports/blind | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Whole stack via sentinel-ui (keyword run only)
        if: matrix.engine == 'keyword'
        run: sentinel-eval --target gateway --out reports/gateway | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.name }}
          path: |
            reports/
            .stack/*.log
